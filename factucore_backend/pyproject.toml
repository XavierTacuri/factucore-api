[project]
name = "factucore-backend"
version = "0.1.0"
description = "Backend FastAPI para migrar el sistema de facturacion legacy."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2",
    "bcrypt==4.0.1",
    "email-validator>=2.2.0",
    "fastapi>=0.111.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.3.4",
    "python-jose[cryptography]>=3.3.0",
    "scalar-fastapi>=1.0.3",
    "sqlmodel>=0.0.21",
    "uvicorn[standard]>=0.30.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
